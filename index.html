<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lahmacun Daveti</title>
  <style>
    body {
      background-color: #fffaf0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
      padding: 30px;
    }
    h1 {
      font-size: 2.5rem;
      color: #d84315;
      margin-top: 20px;
    }
    button {
      font-size: 1.5rem;
      padding: 10px 30px;
      margin: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    #yes {
      background-color: #ff7043;
      color: white;
    }
    #no {
      background-color: #eeeeee;
      color: #555;
      position: absolute;
    }
    #message {
      font-size: 2rem;
      color: #2e7d32;
      margin-top: 40px;
    }
    img {
      max-width: 300px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <!-- Sevimli Lahmacun Foto -->
  <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNzZyMzN3azE5dGJoc3Z2Y21tZGwxbWw5YjB5bzRoMGYxdW00ZDB6MyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3o6ZtpAsBX7XLM6bXW/giphy.gif" alt="Lahmacun">

  <h1>Benimle lahmacun yer misin?</h1>
  <button id="yes">Evet</button>
  <button id="no">Hayır</button>
  <div id="message"></div>

  <!-- Şarkı -->
  <audio autoplay loop>
    <source src="https://www.bensound.com/bensound-music/bensound-sunny.mp3" type="audio/mpeg">
    Tarayıcınız müzik çalmayı desteklemiyor.
  </audio>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const message = document.getElementById("message");

    noBtn.addEventListener("mouseover", () => {
      const i = Math.floor(Math.random() * (window.innerWidth - 100));
      const j = Math.floor(Math.random() * (window.innerHeight - 50));
      noBtn.style.left = `${i}px`;
      noBtn.style.top = `${j}px`;
    });

    yesBtn.addEventListener("click", () => {
      message.innerHTML = "Yaşasın! Lahmacun zamanı 😋";
    });
  </script>
</body>
</html>
